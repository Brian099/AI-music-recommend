<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embeat - 管理后台控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a044ff;
            --bg-gradient: linear-gradient(135deg, #0a0618 0%, #12082b 50%, #040209 100%);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --accent-green: #00ff88;
            --accent-red: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient); color: var(--text-main);
            min-height: 100vh; padding: 20px 40px;
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logo { font-size: 22px; font-weight: 700; color: var(--primary); }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 24px; backdrop-filter: blur(20px);
        }

        .btn {
            padding: 8px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;
            background: var(--primary); color: white; transition: all 0.2s;
        }
        .btn:hover { opacity: 0.9; }

        /* Login Modal */
        #login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: #150a33; border: 1px solid var(--glass-border);
            padding: 30px; border-radius: 16px; width: 340px; text-align: center;
        }
        .input-field {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05); color: white; margin: 16px 0;
        }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="modal-box">
            <h3>🔒 管理员身份认证</h3>
            <input type="password" id="admin-pass" class="input-field" placeholder="请输入管理员密码 (默认 admin123)">
            <button class="btn" style="width: 100%;" onclick="doLogin()">进入管理后台</button>
        </div>
    </div>

    <header>
        <div class="logo">⚙️ Embeat 管理后台控制中心</div>
        <a href="/" class="btn" style="background: rgba(255,255,255,0.1);">返回播放器前台</a>
    </header>

    <div class="grid-container">
        <!-- System Monitor -->
        <div class="card">
            <h3>📊 系统硬件与扫描引擎</h3>
            <p style="margin: 12px 0; color: var(--text-muted);" id="db-status">4500万预置数据库检测中...</p>
            <p style="margin-bottom: 16px; color: var(--text-muted);" id="cpu-status">硬件线程评估中...</p>
            <div style="display:flex; gap:10px;">
                <button class="btn" onclick="startScan()">启动增量断点续扫</button>
                <button class="btn" style="background: var(--accent-red);" onclick="stopScan()">中止扫描</button>
            </div>
            <div style="margin-top: 14px; width: 100%; background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; overflow: hidden;">
                <div id="scan-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #a044ff, #00ff88); transition: width 0.3s ease;"></div>
            </div>
            <div style="margin-top: 12px; background: rgba(0,0,0,0.4); border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; height: 110px; overflow-y: auto; color: var(--text-main);" id="scan-log-box">
                <div style="color: var(--text-muted);">系统日志控制台就绪...</div>
            </div>
        </div>

        <!-- True Lossless Inspector -->
        <div class="card">
            <h3>🟢 真假无损频谱体检</h3>
            <input type="text" id="inspect-path" class="input-field" placeholder="输入音频文件绝对路径">
            <button class="btn" onclick="inspectLossless()">开始 STFT 频谱检测</button>
            <div id="inspect-result" style="margin-top: 14px; font-weight: 600;"></div>
        </div>

        <!-- Deduplication Workstation -->
        <div class="card">
            <h3>🧹 智能音频去重工作台</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 12px;">自动检测 MD5 重复及无损/高码率品质，智能判定保留高质版。</p>
            <button class="btn" onclick="runDedupeScan()">扫描重复文件</button>
            <div id="dedupe-results" style="margin-top: 14px; max-height: 200px; overflow-y: auto;"></div>
        </div>

        <!-- Scraping Workstation -->
        <div class="card">
            <h3>🏷️ LDDC 歌词与元数据刮削工作台</h3>
            <input type="text" id="scrape-path" class="input-field" placeholder="音频文件路径">
            <button class="btn" onclick="scrapeSingleTrack()">单曲在线刮削并写入 ID3/LRC</button>
            <div id="scrape-result" style="margin-top: 14px;"></div>
        </div>
    </div>

    <script>
        let adminToken = localStorage.getItem("admin_token") || "";

        if (adminToken) {
            document.getElementById("login-modal").style.display = "none";
            loadAdminStatus();
        }

        async function doLogin() {
            const pass = document.getElementById("admin-pass").value;
            const res = await fetch("/api/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: pass })
            });
            const data = await res.json();
            if (data.status === "ok") {
                adminToken = data.token;
                localStorage.setItem("admin_token", adminToken);
                document.getElementById("login-modal").style.display = "none";
                loadAdminStatus();
            } else {
                alert("密码错误");
            }
        }

        let pollTimer = null;

        async function loadAdminStatus() {
            try {
                const res = await fetch("/api/admin/status", {
                    headers: { "X-Admin-Token": adminToken }
                });
                if (res.status === 401) {
                    document.getElementById("login-modal").style.display = "flex";
                    return;
                }
                const data = await res.json();
                document.getElementById("db-status").innerText = data.has_global_db ? "🟢 4500万预置数据库: 已就绪 (使能加速比对)" : "⚪ 纯本地轻量模式: 运行中";
                document.getElementById("cpu-status").innerText = `逻辑 CPU 核心: ${data.cpu.total_cpus} 核 | 硬件限制并发: ${data.cpu.max_workers} 线程 (保留1核防卡顿)`;

                const logBox = document.getElementById("scan-log-box");
                if (data.logs && data.logs.length > 0) {
                    logBox.innerHTML = data.logs.map(l => `<div style="padding: 2px 0;">${l}</div>`).join("");
                    logBox.scrollTop = logBox.scrollHeight;
                }

                const progressBar = document.getElementById("scan-progress-bar");
                if (data.status && data.status.is_running) {
                    const pct = data.status.percent || 10;
                    progressBar.style.width = pct + "%";
                    if (!pollTimer) pollTimer = setInterval(loadAdminStatus, 1500);
                } else {
                    progressBar.style.width = (data.status && data.status.phase === 'done') ? "100%" : "0%";
                    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function startScan() {
            const res = await fetch("/api/scan/start", { method: "POST", headers: { "X-Admin-Token": adminToken } });
            const data = await res.json();
            alert(data.message || "扫描已启动！");
            loadAdminStatus();
        }

        async function stopScan() {
            await fetch("/api/scan/stop", { method: "POST", headers: { "X-Admin-Token": adminToken } });
            loadAdminStatus();
        }

        async function inspectLossless() {
            const path = document.getElementById("inspect-path").value;
            const res = await fetch(`/api/quality/analyze?path=${encodeURIComponent(path)}`, {
                method: "POST", headers: { "X-Admin-Token": adminToken }
            });
            const data = await res.json();
            document.getElementById("inspect-result").innerText = `判定结果: ${data.quality_rating} (高频截止点: ${data.cutoff_freq} Hz)`;
        }

        async function runDedupeScan() {
            const res = await fetch("/api/dedupe/scan", { headers: { "X-Admin-Token": adminToken } });
            const data = await res.json();
            document.getElementById("dedupe-results").innerText = `发现 ${data.length} 组重复文件。`;
        }

        async function scrapeSingleTrack() {
            const path = document.getElementById("scrape-path").value;
            const res = await fetch(`/api/scrape/track?path=${encodeURIComponent(path)}`, {
                method: "POST", headers: { "X-Admin-Token": adminToken }
            });
            const data = await res.json();
            document.getElementById("scrape-result").innerText = data.status === "ok" ? "✓ 刮削并嵌入成功！" : "✗ 刮削失败";
        }
    </script>
</body>
</html>

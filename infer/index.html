<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embeat - 高质感 AI 音乐播放器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a044ff;
            --primary-glow: rgba(160, 68, 255, 0.4);
            --bg-gradient: linear-gradient(135deg, #0b071e 0%, #150a33 50%, #05020c 100%);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.09);
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --accent-green: #00ff88;
            --accent-gold: #ffb700;
            --accent-red: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Canvas Palette Glow Background */
        #ambient-glow {
            position: absolute;
            top: -20%; left: -20%;
            width: 140%; height: 140%;
            background: radial-gradient(circle at 50% 50%, rgba(160, 68, 255, 0.15), transparent 70%);
            z-index: 0;
            pointer-events: none;
            transition: background 1.5s ease-in-out;
        }

        header {
            position: relative; z-index: 10;
            padding: 14px 30px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 5, 25, 0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo { font-size: 20px; font-weight: 700; background: linear-gradient(90deg, #c074ff, #8a2be2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .header-actions { display: flex; gap: 12px; align-items: center; }
        .btn-admin {
            padding: 6px 16px; border-radius: 20px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: var(--text-main); font-size: 13px; text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-admin:hover { background: var(--primary-glow); border-color: var(--primary); }

        main {
            position: relative; z-index: 10; flex: 1;
            display: grid; grid-template-columns: 260px 1fr 340px;
            gap: 16px; padding: 16px 20px; overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px; display: flex; flex-direction: column; gap: 8px;
            backdrop-filter: blur(20px);
        }
        .nav-item {
            padding: 12px 16px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px;
            color: var(--text-muted); transition: all 0.2s ease;
        }
        .nav-item:hover, .nav-item.active { background: var(--glass-hover); color: var(--text-main); }
        .nav-item.active { border-left: 3px solid var(--primary); }

        /* Content Area */
        .content-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px; display: flex; flex-direction: column; gap: 16px;
            backdrop-filter: blur(20px); overflow-y: auto;
        }

        .breadcrumb { display: flex; gap: 8px; font-size: 13px; color: var(--text-muted); align-items: center; }
        .breadcrumb-item { cursor: pointer; }
        .breadcrumb-item:hover { color: var(--text-main); }

        .song-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .song-table th { text-align: left; padding: 10px 12px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); }
        .song-table td { padding: 12px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .song-row { cursor: pointer; transition: background 0.2s; }
        .song-row:hover { background: var(--glass-hover); }

        /* Lyrics Panel */
        .lyrics-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            backdrop-filter: blur(20px); overflow-y: auto;
        }
        .cover-art-large { width: 180px; height: 180px; border-radius: 14px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 16px; }
        .lyric-line { padding: 8px 0; font-size: 15px; color: var(--text-muted); transition: all 0.3s ease; cursor: pointer; }
        .lyric-line.active { font-size: 18px; font-weight: 700; color: var(--accent-green); transform: scale(1.05); }

        /* Bottom Player Bar */
        .player-bar {
            position: relative; z-index: 20; height: 86px;
            background: rgba(10, 5, 25, 0.85);
            backdrop-filter: blur(25px); border-top: 1px solid var(--glass-border);
            padding: 0 30px; display: flex; justify-content: space-between; align-items: center;
        }
        .player-track-info { display: flex; align-items: center; gap: 14px; width: 280px; }
        .player-cover { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; }
        .quality-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0, 255, 136, 0.15); color: var(--accent-green); border: 1px solid rgba(0, 255, 136, 0.3); font-weight: 700; }

        .player-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; max-width: 600px; }
        .ctrl-btns { display: flex; align-items: center; gap: 20px; }
        .btn-play { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); border: none; color: white; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px var(--primary-glow); }
        .btn-step { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: white; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s ease; }
        .btn-step:hover { background: rgba(255,255,255,0.25); transform: scale(1.08); }
        .btn-radio { padding: 6px 14px; border-radius: 20px; background: rgba(160, 68, 255, 0.2); border: 1px solid var(--primary); color: #fff; font-size: 12px; cursor: pointer; font-weight: 600; }

        .progress-area { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); }
        .progress-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; width: 0%; }
    </style>
</head>
<body>
    <div id="ambient-glow"></div>

    <header>
        <div class="logo">⚡ Embeat Audio</div>
        <div class="header-actions">
            <a href="/admin" class="btn-admin">⚙️ 管理后台</a>
        </div>
    </header>

    <main>
        <div class="sidebar">
            <div class="nav-item active" onclick="switchNav('folder', event)">📁 目录零等待点播</div>
            <div class="nav-item" onclick="switchNav('artist', event)">🎤 按歌手浏览</div>
            <div class="nav-item" onclick="switchNav('album', event)">💿 按专辑浏览</div>
            <div class="nav-item" onclick="switchNav('radio', event)">⚡ AI 漫游电台</div>
        </div>

        <div class="content-panel" id="content-panel">
            <div class="breadcrumb" id="breadcrumb">
                <span class="breadcrumb-item" onclick="loadFolder('/music')">根目录 /music</span>
            </div>

            <table class="song-table">
                <thead>
                    <tr>
                        <th>曲目名称</th>
                        <th>歌手</th>
                        <th>格式 / 大小</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="song-list">
                    <!-- Dynamic Files -->
                </tbody>
            </table>
        </div>

        <div class="lyrics-panel">
            <img src="https://picsum.photos/200" class="cover-art-large" id="lyric-cover" alt="Cover">
            <h3 id="lyric-title" style="font-size: 16px; margin-bottom: 4px;">Embeat Audio</h3>
            <p id="lyric-artist" style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">选择曲目播放并同步歌词</p>
            <div id="lyrics-container">
                <div class="lyric-line active">🎵 欢迎使用 Embeat Audio</div>
                <div class="lyric-line">请在左侧列表点播任意歌曲</div>
            </div>
        </div>
    </main>

    <div class="player-bar">
        <div class="player-track-info">
            <img src="https://picsum.photos/100" class="player-cover" id="player-cover" alt="Cover">
            <div>
                <div style="font-weight: 600; font-size: 14px;" id="player-title">未选择播放曲目</div>
                <div style="display: flex; gap: 6px; align-items: center; margin-top: 4px;">
                    <span id="player-artist" style="font-size: 12px; color: var(--text-muted);">未知歌手</span>
                    <span class="quality-badge" id="player-quality">FLAC 24bit</span>
                </div>
            </div>
        </div>

        <div class="player-controls">
            <div class="ctrl-btns">
                <button class="btn-step" title="上一曲" onclick="playPrevTrack()">⏮</button>
                <button class="btn-play" id="play-btn" title="播放/暂停" onclick="togglePlay()">▶</button>
                <button class="btn-step" title="下一曲" onclick="playNextTrack()">⏭</button>
                <button class="btn-radio" onclick="toggleAIRadio()">⚡ AI 漫游电台</button>
            </div>
            <div class="progress-area">
                <span id="curr-time">00:00</span>
                <div class="progress-bar" onclick="seekAudio(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="total-time">00:00</span>
            </div>
        </div>

        <audio id="audio-element"></audio>
    </div>

    <script>
        const audio = document.getElementById("audio-element");
        let currentPath = "/music";

        let currentPlaylist = [];
        let currentIndex = -1;
        let currentLyrics = [];

        async function loadFolder(path) {
            currentPath = path;
            const res = await fetch(`/api/library/folder/browse?path=${encodeURIComponent(path)}`);
            const data = await res.json();
            // Update breadcrumb
            const bc = document.getElementById("breadcrumb");
            bc.innerHTML = `<span class="breadcrumb-item" onclick="loadFolder('/music')">根目录 /music</span>`;
            if (data.parent_path && data.current_path !== "/music") {
                bc.innerHTML += ` &gt; <span class="breadcrumb-item" onclick="loadFolder('${data.parent_path.replace(/\\/g, '/')} ')">${data.current_path.replace(/\\/g, '/')}</span>`;
            }

            const tbody = document.getElementById("song-list");
            tbody.innerHTML = "";
            currentPlaylist = data.files || [];

            // Render subfolders
            if (data.folders) {
                data.folders.forEach(f => {
                    const tr = document.createElement("tr");
                    tr.className = "song-row";
                    tr.onclick = () => loadFolder(f.path);
                    tr.innerHTML = `<td colspan="4">📁 <b>${f.name}</b></td>`;
                    tbody.appendChild(tr);
                });
            }

            // Render files
            if (data.files) {
                data.files.forEach(file => {
                    const tr = document.createElement("tr");
                    tr.className = "song-row";
                    tr.onclick = () => playSong(file);
                    tr.innerHTML = `
                        <td>🎵 ${file.track_name}</td>
                        <td>${file.artist_name}</td>
                        <td>${(file.file_size / 1048576).toFixed(1)} MB</td>
                        <td><button style="padding:4px 8px; border-radius:6px; background:var(--primary); color:#fff; border:none; cursor:pointer;" onclick="event.stopPropagation(); playSong(${JSON.stringify(file).replace(/"/g, '&quot;')})">播放</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function playSong(file) {
            if (currentPlaylist && currentPlaylist.length > 0) {
                currentIndex = currentPlaylist.findIndex(f => f.local_path === file.local_path);
            }

            audio.src = `/api/audio/stream?path=${encodeURIComponent(file.local_path)}`;
            audio.play();

            // Bottom player bar updates
            document.getElementById("player-title").innerText = file.track_name;
            document.getElementById("player-artist").innerText = file.artist_name;
            document.getElementById("play-btn").innerText = "⏸";

            // Right-side panel updates (Title, Artist, Cover)
            document.getElementById("lyric-title").innerText = file.track_name;
            document.getElementById("lyric-artist").innerText = file.artist_name;

            const coverUrl = `/api/audio/cover?path=${encodeURIComponent(file.local_path)}`;
            const playerCover = document.getElementById("player-cover");
            const lyricCover = document.getElementById("lyric-cover");

            playerCover.src = coverUrl;
            lyricCover.src = coverUrl;

            const fallbackCover = "https://picsum.photos/200?random=" + Math.abs(file.track_name.length);
            playerCover.onerror = () => { playerCover.src = fallbackCover; };
            lyricCover.onerror = () => { lyricCover.src = fallbackCover; };

            // Format quality badge update
            const ext = file.local_path.split('.').pop().toLowerCase();
            const badge = document.getElementById("player-quality");
            if (ext === "flac" || ext === "wav") {
                badge.innerText = `${ext.toUpperCase()} 真无损`;
                badge.style.borderColor = "var(--accent-green)";
                badge.style.color = "var(--accent-green)";
            } else {
                badge.innerText = `${ext.toUpperCase()} 高品质`;
                badge.style.borderColor = "var(--accent-gold)";
                badge.style.color = "var(--accent-gold)";
            }

            loadLyrics(file.local_path, file.track_name, file.artist_name);

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: file.track_name,
                    artist: file.artist_name,
                    album: 'Embeat Audio',
                    artwork: [{ src: coverUrl, sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('previoustrack', playPrevTrack);
                navigator.mediaSession.setActionHandler('nexttrack', playNextTrack);
            }
        }

        function playNextTrack() {
            if (!currentPlaylist || currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            playSong(currentPlaylist[currentIndex]);
        }

        function playPrevTrack() {
            if (!currentPlaylist || currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playSong(currentPlaylist[currentIndex]);
        }

        audio.onended = () => {
            playNextTrack();
        };

        async function loadLyrics(path, title, artist) {
            const res = await fetch(`/api/lyrics?path=${encodeURIComponent(path)}&title=${encodeURIComponent(title)}&artist=${encodeURIComponent(artist)}`);
            const data = await res.json();
            const container = document.getElementById("lyrics-container");
            container.innerHTML = "";
            currentLyrics = [];

            if (data.lyrics) {
                const lines = data.lyrics.split("\n");
                lines.forEach(l => {
                    const match = l.match(/\[(\d+):(\d+(?:\.\d+)?)\]/);
                    const text = l.replace(/\[\d+:\d+(?:\.\d+)?\]/g, "").trim();
                    if (text) {
                        let timeSec = 0;
                        if (match) {
                            timeSec = parseInt(match[1]) * 60 + parseFloat(match[2]);
                        }
                        const div = document.createElement("div");
                        div.className = "lyric-line";
                        div.id = `lyric-line-${currentLyrics.length}`;
                        div.innerText = text;
                        div.onclick = () => { if (timeSec) audio.currentTime = timeSec; };
                        container.appendChild(div);

                        currentLyrics.push({ time: timeSec, index: currentLyrics.length, element: div });
                    }
                });

                if (currentLyrics.length === 0) {
                    container.innerHTML = `<div class="lyric-line active">暂无纯文本歌词</div>`;
                }
            } else {
                container.innerHTML = `<div class="lyric-line active">暂无歌词</div>`;
            }
        }

        function togglePlay() {
            if (audio.paused) { audio.play(); document.getElementById("play-btn").innerText = "⏸"; }
            else { audio.pause(); document.getElementById("play-btn").innerText = "▶"; }
        }

        function seekAudio(e) {
            if (audio.duration) {
                const rect = e.currentTarget.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                audio.currentTime = pos * audio.duration;
            }
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                document.getElementById("progress-fill").style.width = `${pct}%`;
                document.getElementById("curr-time").innerText = formatTime(audio.currentTime);
                document.getElementById("total-time").innerText = formatTime(audio.duration);

                // Sync lyrics highlighting & scrolling
                if (currentLyrics && currentLyrics.length > 0) {
                    let activeIdx = -1;
                    for (let i = 0; i < currentLyrics.length; i++) {
                        if (audio.currentTime >= currentLyrics[i].time) {
                            activeIdx = i;
                        } else {
                            break;
                        }
                    }
                    if (activeIdx !== -1) {
                        document.querySelectorAll(".lyric-line").forEach(el => el.classList.remove("active"));
                        const activeEl = document.getElementById(`lyric-line-${activeIdx}`);
                        if (activeEl) {
                            activeEl.classList.add("active");
                            activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
                        }
                    }
                }
            }
        };

        async function toggleAIRadio() {
            switchNav('radio');
        }

        async function switchNav(type, e) {
            document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
            if (e && e.currentTarget) {
                e.currentTarget.classList.add("active");
            } else if (event && event.currentTarget) {
                event.currentTarget.classList.add("active");
            }

            if (type === 'folder') {
                loadFolder('/music');
            } else if (type === 'artist') {
                loadArtists();
            } else if (type === 'album') {
                loadAlbums();
            } else if (type === 'radio') {
                loadAIRadio();
            }
        }

        async function loadArtists() {
            const bc = document.getElementById("breadcrumb");
            bc.innerHTML = `<span class="breadcrumb-item">🎤 按歌手分类浏览</span>`;

            try {
                const res = await fetch("/api/library/artists");
                const data = await res.json();

                const tbody = document.getElementById("song-list");
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:var(--text-muted);">暂无歌手数据库记录（请登录后台启动全盘扫描入库）</td></tr>`;
                    return;
                }

                data.forEach(a => {
                    const tr = document.createElement("tr");
                    tr.className = "song-row";
                    tr.onclick = () => loadTracksByArtist(a.artist_name);
                    tr.innerHTML = `
                        <td>🎤 <b>${a.artist_name}</b></td>
                        <td>歌手</td>
                        <td>${a.track_count || 1} 首曲目</td>
                        <td><button style="padding:4px 8px; border-radius:6px; background:var(--primary); color:#fff; border:none; cursor:pointer;">查看曲目</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function loadTracksByArtist(artistName) {
            const bc = document.getElementById("breadcrumb");
            bc.innerHTML = `<span class="breadcrumb-item" onclick="loadArtists()">🎤 按歌手浏览</span> &gt; <span class="breadcrumb-item">${artistName}</span>`;

            const res = await fetch(`/api/library/tracks?artist=${encodeURIComponent(artistName)}`);
            const data = await res.json();
            renderTrackTable(data);
        }

        async function loadAlbums() {
            const bc = document.getElementById("breadcrumb");
            bc.innerHTML = `<span class="breadcrumb-item">💿 按专辑分类浏览</span>`;

            try {
                const res = await fetch("/api/library/albums");
                const data = await res.json();

                const tbody = document.getElementById("song-list");
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:var(--text-muted);">暂无专辑数据库记录（请登录后台启动全盘扫描入库）</td></tr>`;
                    return;
                }

                data.forEach(a => {
                    const tr = document.createElement("tr");
                    tr.className = "song-row";
                    tr.onclick = () => loadTracksByAlbum(a.album_name);
                    tr.innerHTML = `
                        <td>💿 <b>${a.album_name}</b></td>
                        <td>${a.artist_name || '群星'}</td>
                        <td>${a.track_count || 1} 首曲目</td>
                        <td><button style="padding:4px 8px; border-radius:6px; background:var(--primary); color:#fff; border:none; cursor:pointer;">查看曲目</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function loadTracksByAlbum(albumName) {
            const bc = document.getElementById("breadcrumb");
            bc.innerHTML = `<span class="breadcrumb-item" onclick="loadAlbums()">💿 按专辑浏览</span> &gt; <span class="breadcrumb-item">${albumName}</span>`;

            const res = await fetch(`/api/library/tracks?album=${encodeURIComponent(albumName)}`);
            const data = await res.json();
            renderTrackTable(data);
        }

        async function loadAIRadio() {
            const bc = document.getElementById("breadcrumb");
            bc.innerHTML = `<span class="breadcrumb-item">⚡ AI 漫游电台（声学向量推荐）</span>`;

            try {
                const res = await fetch("/api/library/tracks");
                const data = await res.json();
                renderTrackTable(data);
            } catch (err) {
                console.error(err);
            }
        }

        function renderTrackTable(tracks) {
            const tbody = document.getElementById("song-list");
            tbody.innerHTML = "";
            currentPlaylist = tracks || [];

            if (!tracks || tracks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:var(--text-muted);">暂无曲目数据</td></tr>`;
                return;
            }
            tracks.forEach(file => {
                const tr = document.createElement("tr");
                tr.className = "song-row";
                tr.onclick = () => playSong(file);
                tr.innerHTML = `
                    <td>🎵 ${file.track_name}</td>
                    <td>${file.artist_name}</td>
                    <td>${file.file_size ? (file.file_size / 1048576).toFixed(1) + ' MB' : (file.format || 'FLAC')}</td>
                    <td><button style="padding:4px 8px; border-radius:6px; background:var(--primary); color:#fff; border:none; cursor:pointer;" onclick="event.stopPropagation(); playSong(${JSON.stringify(file).replace(/"/g, '&quot;')})">播放</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Init load
        loadFolder("/music");
    </script>
</body>
</html>

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: embeat-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # 可选挂载 4500万预置数据库包；若未找到，Qdrant 自动降级自建纯本地存储
      - ./embeat_qdrant_db:/qdrant/storage
    restart: always

  embeat-api:
    image: brian9909/ai-music-recommend:latest
    container_name: embeat-api-service
    ports:
      - "6335:8000"
    volumes:
      # 挂载宿主机代码目录，保证代码修改实时在容器中生效
      - ./infer:/app/infer
      # 挂载宿主机测试音乐文件夹到容器内的 /music，供离线提取与试听
      - ./测试音乐:/music
      # 挂载宿主机 data 目录持久化 SQLite 关系数据库与缓存（重启/重构不丢失）
      - ./data:/app/data
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MUSIC_DIR=/music
      - ADMIN_PASSWORD=admin123
    depends_on:
      - qdrant
    restart: always
